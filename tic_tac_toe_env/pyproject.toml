[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-tic_tac_toe_env"
version = "0.1.0"
description = "Tic Tac Toe Env environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    # Core OpenEnv runtime (provides FastAPI server + HTTP client types)
    # install from github
    # "openenv @ git+https://github.com/huggingface/OpenEnv.git",
    "openenv>=0.2.2",
    # Environment-specific dependencies
    # Add all dependencies needed for your environment here
    # Examples:
    # "numpy>=1.19.0",
    # "torch>=2.0.0",
    # "gymnasium>=0.29.0",
    # "openspiel>=1.0.0",
    # "smolagents>=1.22.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m tic_tac_toe_env.server.app
server = "tic_tac_toe_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["tic_tac_toe_env", "tic_tac_toe_env.server"]
package-dir = { "tic_tac_toe_env" = ".", "tic_tac_toe_env.server" = "server" }